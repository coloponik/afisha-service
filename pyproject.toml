[project]
name = "Afisha"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "alembic==1.16.2",
    "asgi-lifespan>=2.1.0",
    "dishka>=1.10.1",
    "fastapi==0.116.1",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "psycopg[binary,pool]==3.2.9",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "ruff>=0.12.2",
    "sqlalchemy==2.0.41",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff==0.12.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afisha"]
