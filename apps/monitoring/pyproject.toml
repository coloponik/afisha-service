[project]
name = "monitoring"
version = "0.1.0"
description = "Monitoring service"
requires-python = ">=3.13.7"
dependencies = [
    "alembic>=1.16.2",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi>=0.116.1",
    "faststream[kafka]>=0.7.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff==0.12.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring"]
